name: Acknowledge submission
on:
  issues:
    types: [opened]
permissions:
  issues: write
jobs:
  ack:
    if: contains(github.event.issue.labels.*.name, 'submission')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
              body: "Thank you. This submission is queued; it will be verified with Magma on Mordell at the next pull, " +
                    "and the result will be posted here. The home page (https://x1mn-sporadic.github.io/) shows how many submissions are waiting."
            });
